<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f1f5f9;

        }


        .login-box {

            width: 100%;

            max-width: 400px;

            background: white;

            padding: 40px;

            border-radius: 14px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.1);

        }


        h1 {

            text-align: center;

            margin-bottom: 10px;

            font-size: 32px;

        }


        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

        }


        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            font-size: 16px;

            outline: none;

        }


        input:focus {

            border-color: #2563eb;

        }


        button {

            width: 100%;

            padding: 13px;

            background: #2563eb;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 16px;

            cursor: pointer;

        }


        button:hover {

            background: #1d4ed8;

        }


        #status {

            margin-top: 18px;

            text-align: center;

            font-size: 15px;

        }


        .back-link {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #2563eb;

            text-decoration: none;

        }


        @media (max-width: 500px) {

            .login-box {

                padding: 25px;

            }

        }

    </style>

</head>


<body>


    <div class="login-box">


        <h1>Admin Login</h1>


        <p class="subtitle">

            Login to view portfolio messages

        </p>


        <form id="loginForm">


            <label for="username">
                Username
            </label>


            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required>


            <label for="password">
                Password
            </label>


            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required>


            <button type="submit">

                Login

            </button>


            <p id="status"></p>


        </form>


        <a
            href="/"
            class="back-link">

            ← Back to Portfolio

        </a>


    </div>


    <script>

        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const status =
            document.getElementById(
                "status"
            );


        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const username =
                    document.getElementById(
                        "username"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                status.textContent =
                    "Logging in...";


                status.style.color =
                    "#2563eb";


                try {


                    const response =
                        await fetch(
                            "/api/login",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        username:
                                            username,

                                        password:
                                            password
                                    })

                            }
                        );


                    const result =
                        await response.json();


                    if (result.success) {


                        status.textContent =
                            "Login successful!";


                        status.style.color =
                            "green";


                        setTimeout(
                            () => {

                                window.location.href =
                                    "/admin.html";

                            },
                            300
                        );


                    } else {


                        status.textContent =
                            result.message;


                        status.style.color =
                            "red";

                    }


                } catch (error) {


                    console.error(error);


                    status.textContent =
                        "Server connection failed.";


                    status.style.color =
                        "red";

                }

            }
        );

    </script>


</body>

</html>
