<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Messages</title>


    <style>

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }


        body {

            font-family: Arial, sans-serif;

            background: #f1f5f9;

            color: #111827;

        }


        /* HEADER */

        header {

            background: #111827;

            color: white;

            padding: 20px 35px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

        }


        header h1 {

            font-size: 28px;

        }


        .header-buttons {

            display: flex;

            gap: 10px;

        }


        .refresh-btn,
        .logout-btn {

            color: white;

            border: none;

            padding: 11px 18px;

            border-radius: 7px;

            font-size: 15px;

            cursor: pointer;

        }


        .refresh-btn {

            background: #2563eb;

        }


        .refresh-btn:hover {

            background: #1d4ed8;

        }


        .logout-btn {

            background: #dc2626;

        }


        .logout-btn:hover {

            background: #b91c1c;

        }


        /* MAIN */

        .container {

            max-width: 1100px;

            margin: 35px auto;

            padding: 0 20px;

        }


        /* MESSAGE CARD */

        .message-card {

            background: white;

            border-radius: 12px;

            padding: 25px;

            margin-bottom: 20px;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.08);

        }


        .message-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;

            gap: 15px;

        }


        .message-name {

            font-size: 21px;

            font-weight: bold;

        }


        .message-date {

            color: #6b7280;

            font-size: 14px;

        }


        .message-email {

            color: #2563eb;

            margin-bottom: 15px;

        }


        .message-text {

            line-height: 1.6;

            color: #374151;

            margin-bottom: 20px;

            white-space: pre-wrap;

        }


        /* DELETE */

        .delete-btn {

            background: #dc2626;

            color: white;

            border: none;

            padding: 10px 18px;

            border-radius: 7px;

            cursor: pointer;

        }


        .delete-btn:hover {

            background: #b91c1c;

        }


        /* EMPTY */

        .empty {

            background: white;

            padding: 60px 20px;

            text-align: center;

            border-radius: 12px;

        }


        .empty h2 {

            margin-bottom: 15px;

        }


        .empty p {

            color: #6b7280;

        }


        /* ERROR */

        .error {

            background: white;

            padding: 60px 20px;

            text-align: center;

            border-radius: 12px;

        }


        .error h2 {

            color: #dc2626;

            margin-bottom: 15px;

        }


        /* MOBILE */

        @media (max-width: 600px) {


            header {

                padding: 18px;

                align-items: flex-start;

                flex-direction: column;

            }


            header h1 {

                font-size: 24px;

            }


            .header-buttons {

                width: 100%;

            }


            .refresh-btn,
            .logout-btn {

                flex: 1;

            }


            .message-header {

                flex-direction: column;

                align-items: flex-start;

            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>


        <h1>
            Messages
        </h1>


        <div class="header-buttons">


            <button
                class="refresh-btn"
                onclick="loadMessages()">

                Refresh

            </button>


            <button
                class="logout-btn"
                onclick="logout()">

                Logout

            </button>


        </div>


    </header>


    <!-- CONTENT -->

    <main class="container">


        <div id="messagesContainer">


            <div class="empty">

                <h2>
                    Loading messages...
                </h2>

                <p>
                    Please wait...
                </p>

            </div>


        </div>


    </main>


    <script>


        // ========================================
        // LOAD MESSAGES
        // ========================================

        async function loadMessages() {


            const container =
                document.getElementById(
                    "messagesContainer"
                );


            try {


                const response =
                    await fetch(
                        "/api/messages"
                    );


                if (
                    response.status === 401
                ) {

                    window.location.href =
                        "/login.html";

                    return;

                }


                if (!response.ok) {

                    throw new Error(
                        "Unable to load messages"
                    );

                }


                const messages =
                    await response.json();


                // NO MESSAGES

                if (
                    messages.length === 0
                ) {


                    container.innerHTML = `

                        <div class="empty">

                            <h2>
                                No messages yet
                            </h2>

                            <p>
                                Messages from your
                                portfolio contact
                                form will appear here.
                            </p>

                        </div>

                    `;


                    return;

                }


                // DISPLAY MESSAGES

                container.innerHTML =
                    messages.map(
                        message => `

                        <div class="message-card">


                            <div
                                class="message-header">


                                <div
                                    class="message-name">

                                    ${escapeHTML(
                                        message.name
                                    )}

                                </div>


                                <div
                                    class="message-date">

                                    ${escapeHTML(
                                        message.date
                                    )}

                                </div>


                            </div>


                            <div
                                class="message-email">

                                ${escapeHTML(
                                    message.email
                                )}

                            </div>


                            <div
                                class="message-text">

                                ${escapeHTML(
                                    message.message
                                )}

                            </div>


                            <button
                                class="delete-btn"
                                onclick="deleteMessage(
                                    ${message.id}
                                )">

                                Delete

                            </button>


                        </div>

                    `
                    ).join("");


            } catch (error) {


                console.error(error);


                container.innerHTML = `

                    <div class="error">

                        <h2>
                            Unable to load messages
                        </h2>

                        <p>
                            Please try refreshing
                            the page.
                        </p>

                    </div>

                `;

            }

        }


        // ========================================
        // DELETE MESSAGE
        // ========================================

        async function deleteMessage(id) {


            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this message?"
                );


            if (!confirmDelete) {

                return;

            }


            try {


                const response =
                    await fetch(
                        `/api/messages/${id}`,
                        {

                            method: "DELETE"

                        }
                    );


                if (
                    response.status === 401
                ) {

                    window.location.href =
                        "/login.html";

                    return;

                }


                const result =
                    await response.json();


                if (result.success) {


                    alert(
                        "Message deleted successfully."
                    );


                    loadMessages();


                } else {


                    alert(
                        result.message
                    );

                }


            } catch (error) {


                console.error(error);


                alert(
                    "Unable to delete message."
                );

            }

        }


        // ========================================
        // LOGOUT
        // ========================================

        async function logout() {


            try {


                const response =
                    await fetch(
                        "/api/logout",
                        {

                            method: "POST"

                        }
                    );


                const result =
                    await response.json();


                if (result.success) {

                    window.location.href =
                        "/login.html";

                }


            } catch (error) {


                console.error(error);


                alert(
                    "Unable to logout."
                );

            }

        }


        // ========================================
        // SECURITY
        // ========================================

        function escapeHTML(value) {


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        // ========================================
        // LOAD ON PAGE OPEN
        // ========================================

        loadMessages();


    </script>


</body>

</html>
